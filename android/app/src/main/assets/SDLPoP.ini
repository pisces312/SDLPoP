; SDLPoP configuration (seeded by the Android port on first launch).
; The user can override anything here from the in-game menu
; (Settings > Visuals > "start fullscreen", etc.): those changes are saved to
; SDLPoP.cfg, which takes precedence as long as it is newer than this file.

[General]
; Start in fullscreen so SDL requests an immersive window on Android and the
; system status / navigation bars are hidden while playing.
start_fullscreen = true
